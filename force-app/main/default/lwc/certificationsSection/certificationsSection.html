<template>
    <section class="cert-galaxy">
        <div class="container">
            <h2 class="section-title">Certifications & Credentials</h2>
            
            <div class="galaxy-grid">
                <template for:each={certs} for:item="cert">
                    <div key={cert.id} class="float-container" style={cert.delay}>
                        <div class="glass-card">
                            <div class="card-header">
                                <div class="sf-glow-icon"></div>
                                <span class="cert-year">{cert.year}</span>
                            </div>
                            <h3 class="cert-name">{cert.name}</h3>
                            <div class="card-footer">
                                <span class="badge">Verified</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>
</template>
