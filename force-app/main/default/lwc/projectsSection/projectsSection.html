<template>
    <section id="projects" class="projects-section">
        <div class="container">
            <template for:each={projects} for:item="project">
                <div key={project.id} class={project.containerClass}>
                    
                    <div class="text-content">
                        <p class="featured-tag">Featured Project</p>
                        <h3 class="project-title">{project.title}</h3>
                        
                        <div class="description-card">
                            <p>{project.description}</p>
                        </div>

                        <template if:true={project.link}>
                            <a href={project.link} target="_blank" class="project-link">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                            </a>
                        </template>
                    </div>

                    <div class="image-content">
                        <div class="image-frame">
                            <img src={project.image} alt={project.title}>
                        </div>
                    </div>

                </div>
            </template>
        </div>
    </section>
</template>
